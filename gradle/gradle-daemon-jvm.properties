# Pin the JVM that runs Gradle itself.
#
# Not a preference. Gradle 8.12's embedded Kotlin cannot parse a Java 25 version
# string: building on JDK 25.0.4 fails the build-script compilation with a bare
# "IllegalArgumentException: 25.0.4" from JavaVersion.parse, which names no file
# and no task. Hit on 2026-08-18 when the sdkman "current" symlink moved to 25.
#
# Pinning by toolchain version rather than by path keeps this portable, and
# immune to the default JDK moving underneath the project again.
toolchainVersion=21

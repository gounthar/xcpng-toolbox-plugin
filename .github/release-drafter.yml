# Release Drafter keeps one draft release open on main, accumulating merged pull requests
# into notes and computing the next version from their labels. Nothing is published until a
# human presses publish; that press creates the tag, which fires `release.yml` to build and
# attach the plugin zip.
#
# This mirrors gounthar/xcpng-cloud-plugin deliberately, so the two XCP-ng repositories are
# released the same way. Note it is label-driven, not conventional-commit-driven, even though
# this repository writes conventional commits strictly: the version comes from the labels on
# the merged pull request, so a release still needs a human to have labelled it or to accept
# the patch default.
---
name-template: '$RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'

categories:
  - title: Features
    when:
      labels:
        - enhancement
  - title: Bug fixes
    when:
      labels:
        - bug
  - title: Documentation
    when:
      labels:
        - documentation
  - title: Build, CI, and dependencies
    when:
      labels:
        - build
        - ci
        - dependencies
        - github_actions

  - type: 'pre-exclude'
    when:
      label: skip-changelog

  # The version now resolves from `type: version-resolver` entries in this same list. The
  # last one carries no `when`, which is how the old `default: patch` is spelled in the new
  # form, and it matters more than any individual entry: an unlabelled pull request still
  # lands somewhere sensible instead of silently deciding the version. Where two entries
  # match, the highest increment wins.
  - type: 'version-resolver'
    semver-increment: major
    when:
      labels:
        - major
        - breaking
  - type: 'version-resolver'
    semver-increment: minor
    when:
      labels:
        - minor
        - enhancement
  - type: 'version-resolver'
    semver-increment: patch
    when:
      labels:
        - patch
        - bug
        - documentation
        - dependencies
        - build
        - ci
        - github_actions
  - type: 'version-resolver'
    semver-increment: patch

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
no-changes-template: '- No user-visible changes'

template: |
  $CHANGES

  **Full changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_VERSION

  ## Installing

  This is not a JetBrains Marketplace plugin, and it is not built, endorsed or supported by
  Vates. Download the zip below and extract it into the Toolbox **cache** plugins directory:

  | OS | Path |
  |---|---|
  | Windows | `%LOCALAPPDATA%\JetBrains\Toolbox\cache\plugins\dev.gounthar.xcpng.toolbox` |
  | macOS | `~/Library/Caches/JetBrains/Toolbox/plugins/dev.gounthar.xcpng.toolbox` |
  | Linux | `$XDG_CACHE_HOME/JetBrains/Toolbox/plugins/dev.gounthar.xcpng.toolbox` |

  Quit Toolbox first: it holds its settings in memory and rewrites them on exit, so an
  install while it runs can be clobbered. Note the path is the **cache** directory, not
  `.../Toolbox/plugins`, which is where plugins keep their settings and where Toolbox will
  never look for code.

# Labels applied to a pull request from its own title, so the categories and the version
# resolver above have something to read.
#
# This closes a gap the comment at the top of this file describes but does nothing about: the
# configuration is label-driven while the repository writes conventional commits strictly, so
# every categorisation and every version bump depended on somebody remembering to label. They
# did not. Measured 2026-08-29 over the twelve most recently merged pull requests: six carried
# no label at all, among them #31 (a feature), #37, #44, #45 and #47. Those five are the whole
# of the work merged that day, and the open draft said "No user-visible changes".
#
# The patterns match the conventional-commit type at the start of the title, which is already
# enforced socially here and is the same string the commit carries. Scope is optional and a `!`
# is tolerated, because `fix(xo)!:` is still a fix.
#
# Order matters for exactly one entry. `breaking` is first and matches ANY type carrying `!`,
# so `feat!:` resolves major rather than the minor its type alone would give. Release Drafter
# takes the highest increment among matching resolver entries, so the two labels coexisting on
# one pull request is the intended outcome rather than a conflict.
#
# Types with no entry (chore, refactor, style, test, perf) are deliberate: they have no label
# here to map onto, and the trailing no-`when` version resolver already lands them on patch.
# Adding categories for them would put housekeeping in front of a reader looking for what
# changed.
autolabeler:
  - label: breaking
    title:
      - '/^\w+(\([^)]*\))?!:/'
  - label: bug
    title:
      - '/^fix(\([^)]*\))?!?:/'
  - label: enhancement
    title:
      - '/^feat(\([^)]*\))?!?:/'
  - label: documentation
    title:
      - '/^docs(\([^)]*\))?!?:/'
  - label: build
    title:
      - '/^build(\([^)]*\))?!?:/'
  - label: ci
    title:
      - '/^ci(\([^)]*\))?!?:/'
  # Dependabot labels its own pull requests, but a hand-written dependency bump is the case
  # this catches, and a second identical label is a no-op.
  - label: dependencies
    title:
      - '/^(chore|build)\(deps[^)]*\)!?:/'

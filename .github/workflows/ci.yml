# Builds and tests on every push to main and every pull request.
#
# Until this file existed, nothing but a local `./gradlew build` had ever compiled this code
# or run its tests. The checks that appeared green on pull requests #4, #5 and #7 were
# GitGuardian and CodeRabbit: a secret scanner and a review bot, neither of which builds
# anything. See issue #8.
#
# What this does not do is worth stating, because it is the failure this project keeps hitting:
# a change can compile, pass every test, and still be wrong in the Toolbox UI. Pull request #7
# was exactly that — a display name that was correct in the diff and wrong on screen. CI raises
# the floor here; installing the plugin and looking at it is still the only check for anything
# Toolbox renders.
---
name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The rule this enforces predates the job and was applied by hand, which is why it needed
  # a job: a squashed merge put seven tooling-attribution trailers on the default branch and
  # five source comments cited a working file whose name breaks the same rule. Both passed
  # review. Clearing them meant rewriting history, so the cost of catching this late is not
  # theoretical.
  #
  # fetch-depth: 0 is required, not tidiness. The default shallow checkout does not contain
  # the pull request's base commit, and the script exits 2 rather than 0 when it cannot see
  # it -- "could not check" must never render as a green tick.
  tooling-references:
    name: no tooling references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tracked content and commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ -n "$BASE" ] && [ -n "$HEAD" ]; then
            bash .github/scripts/check-tooling-references.sh "$BASE" "$HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # Backstop on main. The pull request check runs before the merge, so it never sees
            # the message GitHub composes for a squashed merge -- which is exactly how seven
            # attribution trailers reached the default branch in the first place.
            bash .github/scripts/check-tooling-references.sh "$PUSH_BEFORE" "$PUSH_AFTER"
          else
            bash .github/scripts/check-tooling-references.sh
          fi

      # The title and body are the other half of a squashed merge message, and neither passes
      # through any git hook. A clean set of commits can still produce a dirty merge commit if
      # the description carries a reference, so it is checked from the API rather than assumed.
      - name: Check the pull request title and body
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pattern="$(base64 -d < .github/tooling-patterns.b64 | tr -d '\n')"
          gh api "repos/$REPO/pulls/$PR" --jq '.title, .body' > /tmp/pr-text.txt
          if grep -Pn "$pattern" /tmp/pr-text.txt; then
            echo "::error::The pull request title or body names a development tool." >&2
            echo "A squashed merge composes its commit message from these, so this would land on main." >&2
            exit 1
          fi
          echo "Pull request text clean."

  build:
    name: JDK 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 21, and not by preference. gradle/gradle-daemon-jvm.properties pins
      # toolchainVersion=21 because Gradle 8.12's embedded Kotlin cannot parse a Java 25
      # version string: it fails while compiling the *build script* with a bare
      # "IllegalArgumentException: 25.0.4" naming no file, no task and no cause. A runner
      # defaulting to a newer JDK reproduces that exactly.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The wrapper jar is a binary committed to this repository. Validating it against
      # Gradle's published checksums is the one cheap guard against it being swapped.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # `build` covers compileKotlin, test and jar. The Toolbox API artifacts it resolves are
      # not on Maven Central — they come from packages.jetbrains.team, anonymously readable
      # (verified 2026-08-20). No credential is needed and none should be added here.
      - name: Build and test
        run: ./gradlew build

      # The zip a release would ship. Building it on every run means packaging breaks surface
      # here rather than at release time, when the tag already exists.
      - name: Package the plugin
        run: ./gradlew packagePlugin

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  # A workflow file that fails the Actions schema does not produce a lint error anyone can
  # read: GitHub attributes the invalid file to the triggering push and emits a run with zero
  # jobs and a failure conclusion. yamllint reports nothing, because the YAML is well formed
  # and it is the schema that is wrong. This repository is gaining several workflow files at
  # once, which is exactly when that bites.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned rather than `latest`, so a green run stays evidence about a known actionlint.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          actionlint --version

      # actionlint shells out to shellcheck for every run: block, and ubuntu-latest ships it,
      # so this lints the shell embedded in these workflows as well as their schema.
      - name: Lint the workflow files
        run: actionlint -color

# Dependabot for the two ecosystems this repository actually has: Gradle, and the GitHub
# Actions the workflows pin.
#
# Weekly rather than daily. This is a personal project with a handful of open pull requests;
# a daily cadence would make dependabot most of the repository's traffic.
#
# One dependency has no automation here: the Toolbox API artifacts
# (com.jetbrains.toolbox:core-api, :ui-api, :remote-dev-api) come from
# packages.jetbrains.team, not Maven Central, and dependabot is not configured for that
# registry. Bump those by reading <release> by hand.
#
# CORRECTION, 2026-08-20. This paragraph used to add that automation would be "arguably
# better" avoided because maven-metadata.xml lists a stale <versions> set. That was measured
# false: all three artifacts carry 20 versions including both the current release and Coder's
# pin, and each list agrees with its own <release>. The reason to keep this manual is the
# registry, not the metadata.
#
# Kotlin is ignored on the same grounds, and this file is where the reason was already
# written down and not acted on. The paragraph that stood here said a Kotlin bump was "a
# real change to test, not a routine one to wave through" — and then left Kotlin out of the
# ignore list below, so #15 raised 2.3.10 -> 2.4.10 and merged green. That is the failure
# named four paragraphs down, committed in the file that names it.
#
# The constraint is two-sided. The compiler must be new enough to read the Kotlin 2.3.0
# binary metadata in the Toolbox API jars, and kotlin-stdlib is host-provided as well, so
# the pin is bounded above by whatever bin/lib carries (2.4.10-RC2 in Toolbox 3.7.0.87111).
# Full working in gradle/libs.versions.toml, next to the value itself.
#
# kotlinx-coroutines and kotlinx-serialization are ignored outright, and that is not
# neglect. Both are compileOnly because Toolbox ships them, so their pinned value is a
# RUNTIME FLOOR read out of bin/lib in the installed app — not a release to keep current.
# Raising one lifts the compile ceiling above the runtime floor, and CI cannot catch it
# because CI only compiles; the failure is a NoSuchMethodError inside Toolbox.
#
# This is written down because it already happened: #12 and #13 raised both on 2026-08-20
# and merged green, past a comment in libs.versions.toml that named the exact bundled jar
# the pin was matched to. A version constraint whose reason lives only in a comment is one
# a bot will walk through.
#
# Track these by re-reading bin/lib after a Toolbox upgrade, and bump them TO what is there.
#
# That instruction had no trigger. Toolbox self-upgraded 3.7.0.87111 -> 3.7.1.87197 on
# 2026-08-20 mid-session, silently, and was noticed only because a log line changed its
# version prefix. It also needed the app installed on the machine doing the reading.
#
# Neither is true any more. JetBrains publishes the build feed and, per build, a manifest of
# what it bundles:
#
#   https://data.services.jetbrains.com/products/releases?code=TBA&latest=true
#   https://resources.jetbrains.com/storage/third-party-libraries/toolbox/
#     toolbox-<build>.third-party-libraries.json
#
# The second lists Kotlin, kotlinx.coroutines and kotlinx.serialization by display name, and
# all three were verified against the installed 3.7.1.87197 bin/lib before this was written
# down. That makes the check automatable without an install; tracked as an issue rather than
# built here, because this repo has no updatecli yet.
---
version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # Host-provided at runtime by Toolbox. Pinned to the installed app's bin/lib,
      # bumped by hand after a Toolbox upgrade. See the note at the top of this file.
      - dependency-name: org.jetbrains.kotlinx:kotlinx-coroutines-core
      - dependency-name: org.jetbrains.kotlinx:kotlinx-serialization-json
      # Same reason: kotlin-stdlib is host-provided too, so the Kotlin version has a
      # ceiling as well as a floor. Both plugins read version.ref = "kotlin", so both
      # are named even though dependabot reported only the first in #15.
      - dependency-name: org.jetbrains.kotlin.jvm
      - dependency-name: org.jetbrains.kotlin.plugin.serialization

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github_actions
